name: fuelthai
description: แอพตรวจสอบราคาน้ำมันแบบ Realtime
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # แผนที่ — OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_map_cancellable_tile_provider: ^2.0.0
  # Location
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  # HTTP / API
  http: ^1.1.0
  # State
  provider: ^6.1.1
  # Font ภาษาไทย
  google_fonts: ^6.2.1
  # Utils
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
